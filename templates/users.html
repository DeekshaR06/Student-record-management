{% extends "base.html" %}{% block content %}
<h2>Users</h2>
<form method="post" class="grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password (min 8)" required>
<select name="role"><option value="viewer">viewer</option><option value="admin">admin</option></select>
<button class="btn">Add user</button></form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.user_id }}</td><td>{{ r.username }}</td><td><span class="pill {{ r.role }}">{{ r.role }}</span></td><td>{{ r.created_at }}</td>
<td><form class="inline" method="post" action="/users/{{ r.user_id }}/delete" onsubmit="return confirm('Delete this user?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button class="btn del">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>
<p class="muted small">Admins can change data and manage users. Viewers can only view data and run reports.</p>
{% endblock %}
