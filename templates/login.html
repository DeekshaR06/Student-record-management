{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block bodyclass %}login-page{% endblock %}{% block content %}
<div class="login-card">
<div class="login-brand">&#127891;</div>
<h1>Student Records</h1><p class="muted">Sign in to continue</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username</label><input name="username" required autofocus autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button class="btn block">Sign in</button></form>
<p class="muted small" style="margin-top:16px">Authorised users only. Sign-in attempts are logged.</p>
</div>
{% endblock %}
