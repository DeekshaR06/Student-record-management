<!doctype html>
<html><head><meta charset="utf-8"><title>Student Record Management</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8}
nav{background:#1f3a5f;padding:12px 24px}nav a{color:#fff;margin-right:20px;text-decoration:none}
main{max-width:900px;margin:24px auto;background:#fff;padding:24px;border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
input,select{padding:7px;margin:4px 0 10px;width:100%;box-sizing:border-box}
.btn{background:#1f3a5f;color:#fff;border:0;padding:7px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;width:auto;font-size:14px}
.del{background:#b00020}.msg{background:#e8f0fe;padding:8px 12px;margin-bottom:12px;border-radius:4px}
form.inline{display:inline}
</style></head><body>
<nav><a href="/students">Students</a><a href="/courses">Courses</a><a href="/enrollments">Enrollments</a></nav>
<main>
{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
