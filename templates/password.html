{% extends "base.html" %}{% block content %}
<h2>Change password</h2>
<form method="post" style="max-width:420px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password</label><input type="password" name="current" required>
<label>New password (min 8 characters)</label><input type="password" name="new" required>
<label>Confirm new password</label><input type="password" name="confirm" required>
<button class="btn">Change password</button></form>
{% endblock %}
