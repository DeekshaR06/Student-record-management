{% extends "base.html" %}{% block content %}
<h2>Students</h2><p><a class="btn" href="/students/add">+ Add Student</a></p>
<table><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>DOB</th><th>Actions</th></tr>
{% for r in rows %}<tr><td>{{ r.student_id }}</td><td>{{ r.first_name }} {{ r.last_name }}</td>
<td>{{ r.email }}</td><td>{{ r.phone or '' }}</td><td>{{ r.date_of_birth or '' }}</td>
<td><a class="btn" href="/students/{{ r.student_id }}/edit">Edit</a>
<form class="inline" method="post" action="/students/{{ r.student_id }}/delete" onsubmit="return confirm('Delete this student?')">
<button class="btn del">Delete</button></form></td></tr>
{% else %}<tr><td colspan="6">No students yet.</td></tr>{% endfor %}</table>
{% endblock %}
